name: Image PRs Build

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - master

jobs:
  build-and-push-prs:
    if: ${{ github.repository == 'cilium/json-mock' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - name: json-mock
            dockerfile: ./Dockerfile

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      - name: Getting image tag
        id: tag
        env:
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "tag=${PR_SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Build PR image (without publishing)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        id: docker_build_ci_pr
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          platforms: linux/amd64,linux/arm64
          tags: |
            quay.io/${{ github.repository_owner }}/${{ matrix.name }}-ci:${{ steps.tag.outputs.tag }}

      - name: Write PR image digest
        shell: bash
        run: |
          mkdir -p image-digest/
          echo "quay.io/${{ github.repository_owner }}/${{ matrix.name }}-ci:${{ steps.tag.outputs.tag }}@${{ steps.docker_build_ci_pr.outputs.digest }}" > image-digest/${{ matrix.name }}.txt

      - name: Upload artifact digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-digest ${{ matrix.name }}
          path: image-digest
          retention-days: 1

  publish-master:
    if: ${{ github.repository == 'cilium/json-mock' && github.event_name == 'push' }}
    name: Build and publish master image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    # Pins the OIDC token subject to the publishing environment used by Quay.
    environment:
      name: publish-ci-images
      deployment: false
    strategy:
      matrix:
        include:
          - name: json-mock
            dockerfile: ./Dockerfile

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      # Exchange the GitHub OIDC token for a short-lived Quay robot token.
      - name: Get a quay.io robot token via OIDC
        id: registry-token
        env:
          ROBOT: ${{ vars.QUAY_ROBOT_CI }}
        run: |
          oidc_token="$(curl -sSf --retry 3 --retry-all-errors \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=quay.io" \
            | jq -er '.value')"
          echo "::add-mask::${oidc_token}"

          robot_token="$(printf 'user = "%s:%s"\n' "${ROBOT}" "${oidc_token}" \
            | curl -sSf --retry 3 --retry-all-errors -K - \
              "https://quay.io/oauth2/federation/robot/token" \
            | jq -er '.token')"
          echo "::add-mask::${robot_token}"

          echo "token=${robot_token}" >> "$GITHUB_OUTPUT"

      - name: Login to quay.io for CI
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: quay.io
          username: ${{ vars.QUAY_ROBOT_CI }}
          password: ${{ steps.registry-token.outputs.token }}

      - name: Get image tag
        id: tag
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Build and publish master image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        id: docker_build_ci_master
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            quay.io/${{ github.repository_owner }}/${{ matrix.name }}-ci:latest
            quay.io/${{ github.repository_owner }}/${{ matrix.name }}-ci:${{ steps.tag.outputs.tag }}

      - name: Write master image digests
        shell: bash
        run: |
          mkdir -p image-digest/
          echo "quay.io/${{ github.repository_owner }}/${{ matrix.name }}-ci:latest@${{ steps.docker_build_ci_master.outputs.digest }}" > image-digest/${{ matrix.name }}.txt
          echo "quay.io/${{ github.repository_owner }}/${{ matrix.name }}-ci:${{ steps.tag.outputs.tag }}@${{ steps.docker_build_ci_master.outputs.digest }}" >> image-digest/${{ matrix.name }}.txt

      - name: Upload artifact digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-digest ${{ matrix.name }}
          path: image-digest
          retention-days: 1

  image-digests:
    if: ${{ always() && github.repository == 'cilium/json-mock' && (needs.build-and-push-prs.result == 'success' || needs.publish-master.result == 'success') }}
    name: Display Digests
    runs-on: ubuntu-24.04
    needs:
      - build-and-push-prs
      - publish-master
    steps:
      - name: Downloading Image Digests
        shell: bash
        run: mkdir -p image-digest/

      - name: Download digests of all images built
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: image-digest/
          pattern: "*image-digest *"

      - name: Image Digests Output
        shell: bash
        run: |
          cd image-digest/
          find -type f | sort | xargs -d '\n' cat
